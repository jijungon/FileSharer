name: CI
on:
  pull_request:
    # labeled: PR에 'e2e' 라벨을 달면 스모크가 돌도록 (아래 e2e 잡의 if 참고)
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # ── 게이트: 라벨만 단 이벤트에선 무거운 잡을 다시 돌리지 않는다(e2e만 재실행) ──
  secrets-scan:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 전체 히스토리 스캔 (한 번 새면 히스토리에 남으므로)
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13" # 로컬(3.13)과 일치 — 로컬=CI 동일 원칙
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  frontend:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22 # 로컬(v22)과 일치
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build

  # ── 통합 스모크(도커 컴포즈로 실제 구동 → Playwright). main push면 항상, PR은 'e2e' 라벨일 때 ──
  e2e:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: CI용 .env 구성 (example의 안전한 기본값 + 테스트 관리자)
        run: |
          cp .env.example .env
          echo "ADMIN_EMAIL=e2e@test.local" >> .env
          echo "ADMIN_PASSWORD=e2e-password-123" >> .env
          echo "BASE_URL=http://localhost:8484" >> .env
      - run: docker compose up -d --build
      - name: 서버 기동 대기
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8484/api/health && exit 0
            sleep 2
          done
          echo "server did not come up" && exit 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - run: cd e2e && npx playwright test
        env:
          BASE_URL: http://localhost:8484
      - name: 로그 수집·정리
        if: always()
        run: |
          docker compose logs > compose.log || true
          docker compose down -v
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-logs
          path: |
            compose.log
            e2e/test-results/

  image:
    needs: [secrets-scan, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # arm64(오라클 Ampere 등)용 크로스 빌드를 위해 QEMU + buildx
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: GHCR 로그인 (main push일 때만)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # PR은 amd64만 빌드해 빠르게 검증, main push면 amd64+arm64 멀티아치로 GHCR에 push
      - name: 빌드 (main push면 GHCR push까지)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/jijungon/filesharer:latest
            ghcr.io/jijungon/filesharer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 자동 배포(CD): main push에서 이미지 + 스모크가 모두 통과하면 오리진에 배포 ──
  # 배포용 SSH 키/호스트가 리포 Secrets에 없으면 안전하게 스킵(경고만)한다.
  deploy:
    name: deploy (prod)
    needs: [image, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: SSH로 오리진 배포
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "::warning::DEPLOY_SSH_KEY/DEPLOY_HOST 미설정 — 자동배포를 건너뜁니다. 리포 Settings → Secrets and variables → Actions 에 추가하면 활성화됩니다."
            exit 0
          fi
          user="${DEPLOY_USER:-ubuntu}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "→ $user@$DEPLOY_HOST 로 배포"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$user@$DEPLOY_HOST" 'set -e
              cd ~/filesharer
              docker compose pull app
              docker compose up -d app
              sleep 6
              curl -fsS http://localhost:80/api/health'
          echo "✅ 배포 + 헬스체크 완료"
