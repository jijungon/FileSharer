name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 전체 히스토리 스캔 (한 번 새면 히스토리에 남으므로)
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13" # 로컬(3.13)과 일치 — 로컬=CI 동일 원칙
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22 # 로컬(v22)과 일치
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build

  # ── 의존성 취약점 스캔(위생). 배포 파이프라인(image)과 분리 — needs 체인에 없어서 빨간불이어도
  #    배포는 막지 않고 '알림'만 한다. 실제로 배포되는 코드에 초점을 둬 노이즈를 줄인다:
  #    · pip-audit: 백엔드 런타임 의존성만(도구 pip 자신은 최신화해 pip 자체 권고 노이즈 제외)
  #    · npm audit: 프런트 '프로덕션' 의존성(--omit=dev)만 + high 이상 → 빌드/테스트 툴(vite·
  #      vitest·esbuild, prod 미탑재)과 moderate는 게이트에서 제외(존재 자체는 로그에 남음).
  deps-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: pip-audit (backend 런타임 의존성)
        working-directory: backend
        run: |
          python -m pip install -U pip
          pip install -e . pip-audit
          pip-audit
      - name: npm audit (frontend 프로덕션 의존성, high+)
        if: always() # pip-audit가 빨간불이어도 프런트 결과까지 함께 보이게
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # ── 통합 스모크(도커 컴포즈로 실제 구동 → Playwright). 모든 PR + main push에서 실행(라벨 불필요) ──
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: CI용 .env 구성 (example의 안전한 기본값 + 테스트 관리자)
        run: |
          cp .env.example .env
          echo "ADMIN_EMAIL=e2e@test.local" >> .env
          echo "ADMIN_PASSWORD=e2e-password-123" >> .env
          echo "BASE_URL=http://localhost:8484" >> .env
          echo "ENABLE_TEST_RESET=1" >> .env  # 테스트 격리용 /api/test/reset 활성화(CI 전용)
      - run: docker compose up -d --build
      - name: 서버 기동 대기
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8484/api/health && exit 0
            sleep 2
          done
          echo "server did not come up" && exit 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - run: cd e2e && npx playwright test
        env:
          BASE_URL: http://localhost:8484
      - name: 로그 수집·정리
        if: always()
        run: |
          docker compose logs > compose.log || true
          docker compose down -v
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-logs
          path: |
            compose.log
            e2e/test-results/

  image:
    needs: [secrets-scan, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # arm64(오라클 Ampere 등)용 크로스 빌드를 위해 QEMU + buildx
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: GHCR 로그인 (main push일 때만)
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 앱 버전 = 머지된 PR 번호. 규칙: "버전 == PR 번호"(무슨 일이 있어도 자동 일치).
      # squash 머지 커밋의 제목 끝에 GitHub이 붙이는 (#NN)에서 뽑는다(제목 줄만 보고 마지막
      # #숫자 채택 → 본문의 다른 이슈참조에 안 휘둘림). 못 찾으면 빈 값 → package.json 폴백.
      - name: 앱 버전 산출 (머지 커밋 (#NN) → v0.0.NN)
        id: appver
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          SUBJECT=$(printf '%s' "$HEAD_MSG" | head -1)
          NUM=$(printf '%s' "$SUBJECT" | grep -oE '#[0-9]+' | tail -1 | tr -d '#')
          if [ -n "$NUM" ]; then
            echo "value=v0.0.$NUM" >> "$GITHUB_OUTPUT"
            echo "앱 버전 = v0.0.$NUM (PR #$NUM)"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
            echo "PR 번호 못 찾음 → package.json 버전으로 폴백"
          fi
      # PR은 amd64만 빌드해 빠르게 검증, main push면 amd64+arm64 멀티아치로 GHCR에 push
      - name: 빌드 (main push면 GHCR push까지)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          build-args: |
            APP_VERSION=${{ steps.appver.outputs.value }}
          tags: |
            ghcr.io/jijungon/filesharer:latest
            ghcr.io/jijungon/filesharer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 자동 배포(CD): 오리진의 watchtower가 pull 방식으로 처리 ──
  # 오리진(Oracle)이 인바운드 SSH를 소스 IP로 제한 → GitHub 러너에서의 SSH 배포는
  # 연결 타임아웃으로 불가. 그래서 CD는 오리진 쪽에서 pull 한다: 오리진의 watchtower
  # 컨테이너가 GHCR의 :latest 를 ~60초 폴링하다가, 위 image 잡이 새 :latest 를 push하면
  # 자동으로 pull → app 컨테이너 재생성한다(인바운드/방화벽 변경 불필요, 이미지가
  # public이라 레지스트리 인증도 불필요).
  # 오리진 설정: ~/filesharer/compose.override.yml 의 watchtower 서비스(--label-enable로
  # app 컨테이너만 감시). 배포용 DEPLOY_* Secrets는 더 이상 사용하지 않는다.
