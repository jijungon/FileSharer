# 러너 이미지는 모든 잡에서 **ubuntu-24.04 로 고정**한다.
# `ubuntu-latest` 는 2026-10-19부터 Ubuntu 26 을 가리킨다. 그날 이미지가 말없이 바뀌면
# 무관한 이유로 CI가 빨개지고 "내 PR이 깨뜨렸나"를 뒤지게 된다. 이 저장소는 CI가 배포의
# 관문이라(그린이어야 머지·배포) 남의 일정에 흔들릴 이유가 없다.
#
# 값을 한 곳에 모으지 못하는 이유: `runs-on` 은 env 컨텍스트를 읽지 못한다
# (github/needs/strategy/matrix/vars/inputs 만 가능). 그래서 6곳에 그대로 적는다.
#
# 올릴 때: 러너만 바꾸는 PR 하나로 6곳을 고치고, 잡이 전부 그린인지 보고 머지한다.
# 고정 이미지도 언젠가 폐기 안내가 뜨므로 1년에 한 번쯤 확인한다.
name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    tags: ["v*"] # 태그를 미는 것이 곧 배포다(아래 image 잡 참고)

permissions:
  contents: read
  packages: write

# **최신 것만 돌린다.** PR 이면 다시 푸시할 때 옛 실행을, main 이면 연달아 머지할 때
# 앞선 실행을 취소한다.
#
# main 도 취소하는 이유: PR 을 3개쯤 모아 연달아 머지하면, 중간 상태는 어차피 배포되지 않는다.
# 검증해야 할 것은 **최종 합쳐진 상태**이고 마지막 실행이 바로 그걸 본다. 중간 실행을 끝까지
# 돌리면 제일 느린 e2e(약 3분)를 머지 횟수만큼 반복하고 배포도 그만큼 나간다.
# (처음엔 "머지마다 기록을 남겨야 한다"며 main 을 취소하지 않았는데, 그 기록은 각 PR 의
#  CI 에 이미 있다. 과한 판단이었다.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 전체 히스토리 스캔 (한 번 새면 히스토리에 남으므로)
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13" # 로컬(3.13)과 일치 — 로컬=CI 동일 원칙
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22 # 로컬(v22)과 일치
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build

  # ── 의존성 취약점 스캔(위생). 배포 파이프라인(image)과 분리 — needs 체인에 없어서 빨간불이어도
  #    배포는 막지 않고 '알림'만 한다. 실제로 배포되는 코드에 초점을 둬 노이즈를 줄인다:
  #    · pip-audit: 백엔드 런타임 의존성만(도구 pip 자신은 최신화해 pip 자체 권고 노이즈 제외)
  #    · npm audit: 프런트 '프로덕션' 의존성(--omit=dev)만 + high 이상 → 빌드/테스트 툴(vite·
  #      vitest·esbuild, prod 미탑재)과 moderate는 게이트에서 제외(존재 자체는 로그에 남음).
  deps-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: pip-audit (backend 런타임 의존성)
        working-directory: backend
        run: |
          python -m pip install -U pip
          pip install -e . pip-audit
          pip-audit
      - name: npm audit (frontend 프로덕션 의존성, high+)
        if: always() # pip-audit가 빨간불이어도 프런트 결과까지 함께 보이게
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # ── 통합 스모크(도커 컴포즈로 실제 구동 → Playwright). 모든 PR + main push에서 실행(라벨 불필요) ──
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: CI용 .env 구성 (example의 안전한 기본값 + 테스트 관리자)
        run: |
          cp .env.example .env
          echo "ADMIN_EMAIL=e2e@test.local" >> .env
          echo "ADMIN_PASSWORD=e2e-password-123" >> .env
          echo "BASE_URL=http://localhost:8484" >> .env
          echo "ENABLE_TEST_RESET=1" >> .env  # 테스트 격리용 /api/test/reset 활성화(CI 전용)
      - run: docker compose up -d --build
      - name: 서버 기동 대기
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8484/api/health && exit 0
            sleep 2
          done
          echo "server did not come up" && exit 1
      # 문서(deploy/PROD.md·RESTORE.md)가 안내하는 운영 명령을 **컨테이너 안에서 그대로** 돌린다.
      # 스크립트가 이미지에 안 들어가면 여기서 잡힌다 — 실제로 한 번 놓쳐서 서버에서 죽었다.
      - name: 운영 스크립트가 이미지 안에서 실행되는가
        run: |
          docker compose exec -T app python scripts/user_admin.py list
          docker compose exec -T app python scripts/backup_list.py
          docker compose exec -T app python scripts/user_admin.py --help
          # 정합성 점검(읽기 전용). 깨끗하면 0, 본체 없는 파일이 있으면 1을 낸다 —
          # 방금 만든 e2e 데이터는 깨끗해야 하므로 0이 아니면 진짜 문제다.
          docker compose exec -T app python scripts/missing_blobs.py
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: cd e2e && npm ci && npx playwright install --with-deps chromium
      # npm test = solo(병렬) 다음 shared(--workers=1). 두 번 부르는 이유는 Playwright 가
      # 프로젝트별 워커 수를 못 정하기 때문이다(e2e/playwright.config.ts 주석 참고).
      # 워커 수는 러너 코어에 맞춘다 — 브라우저 넷과 백엔드가 같은 머신에서 돈다.
      - run: cd e2e && npm test
        env:
          BASE_URL: http://localhost:8484
          PW_WORKERS: 3
      - name: 로그 수집·정리
        if: always()
        run: |
          docker compose logs > compose.log || true
          docker compose down -v
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-logs
          path: |
            compose.log
            e2e/test-results/

  # **굽는 것과 내보내는 것을 가른다.**
  #
  # 배포의 정의는 '`:latest` 가 움직이는 것'이다 — 서버의 watchtower 가 그것만 본다.
  # 그러니 게이트를 걸어야 할 곳은 **굽기**가 아니라 **태그 붙이기**다.
  #
  #   image   — e2e 와 **동시에** 굽는다. :<sha> 로만 올린다(아무도 안 본다).
  #   promote — e2e 가 초록이어야 돈다. :latest / :<태그> / :b<빌드> 를 붙인다 = 배포.
  #
  # 예전엔 image 가 e2e 를 기다렸다. 게이트로서는 맞았지만 **굽는 3분 30초가 통째로
  # 배포 시간에 얹혔다**(태그 배포 8분 31초 = e2e 4분 54초 + image 3분 31초, 직렬).
  # 지금은 굽기가 e2e 뒤에 숨고, 남는 건 레지스트리에서 태그만 옮기는 몇 초다.
  # 게이트는 그대로다 — e2e 가 깨지면 promote 가 안 돌고 :latest 는 제자리에 있다.
  image:
    needs: [secrets-scan]
    runs-on: ubuntu-24.04
    outputs:
      promote: ${{ steps.appver.outputs.promote }}
      version: ${{ steps.appver.outputs.version }}
      src: ${{ steps.appver.outputs.src }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 빌드 번호를 main 커밋 수로 뽑으므로 전체 히스토리가 필요하다
      - uses: docker/setup-buildx-action@v4
      - name: GHCR 로그인 (main push일 때만)
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 머지와 배포가 갈려 있다. **태그를 밀어야 나간다.**
      #   머지        → v0.0.<빌드> · 이미지 :b<빌드> 만. 아무데도 안 나감.
      #   v0.* 태그   → dev 배포.  번호는 빌드 번호를 그대로(지금까지 세던 번호를 이어감).
      #   v1.* 태그   → prod 배포. 번호는 사람이 정한다.
      # 둘 다 같은 서버로 나간다(환경은 하나다). 앞자리는 '어떤 성격의 배포였는지'를 남긴다.
      # PR 번호를 버전으로 쓰다가 #159 다음에 #158 이 배포되는 일이 있었다(머지 순서와
      # PR 번호 순서는 다르다). 숫자만 보고 최신을 판단할 수 있어야 해서 커밋 수를 쓴다.
      # PR 번호는 '어느 작업인지'로만 따로 들고 간다.
      - name: 버전·이미지 태그 산출
        id: appver
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
          IMAGE: ghcr.io/jijungon/filesharer
        run: |
          BUILD=$(git rev-list --count HEAD)   # 스쿼시 머지마다 정확히 1씩 는다
          SUBJECT=$(printf '%s' "$HEAD_MSG" | head -1)
          # 제목 줄만 보고 마지막 #숫자 채택 → 본문의 다른 이슈참조에 안 휘둘린다
          PR=$(printf '%s' "$SUBJECT" | grep -oE '#[0-9]+' | tail -1 | tr -d '#')

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="$TAG"
            # 사람이 읽는 태그는 promote 가 붙인다(e2e 초록 뒤에). 여기선 굽기만 한다.
            PROMOTE="$IMAGE:latest
          $IMAGE:$TAG"
            case "$TAG" in
              v0.*) echo "dev 배포 — $VERSION (e2e 통과 후 :latest 로 승격)" ;;
              *)    echo "prod 배포 — $VERSION (e2e 통과 후 :latest 로 승격)" ;;
            esac
          else
            VERSION="v0.0.$BUILD"
            PROMOTE="$IMAGE:b$BUILD"   # :latest 는 건드리지 않는다 → 아무데도 안 나간다
            echo "개발 빌드 — $VERSION (배포되지 않음)"
          fi
          # 굽는 쪽이 올리는 건 이 run 전용 주소 하나뿐이다 — 아무도 이걸 폴링하지 않으므로
          # e2e 가 끝나기 전에 올라가도 배포되지 않는다.
          #
          # **run 번호를 붙이는 이유**: 태그를 밀면 같은 커밋에서 run 이 둘 돈다(main push
          # 하나, 태그 하나). 예전엔 둘 다 ":<sha>" 에 밀어서 나중 것이 앞의 것을 덮었고,
          # promote 가 그 자리를 :latest 로 복사하는 바람에 **버전 라벨이 뒤바뀌었다** —
          # v1.0.10 을 밀었는데 라이브가 v0.0.184 라고 말했다(코드는 같은 커밋이라 정상).
          # run 마다 자리를 따로 쓰면 각자 자기 것을 승격한다.
          SRC="$IMAGE:$GITHUB_SHA-$GITHUB_RUN_ID"
          TAGS="$SRC"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "pr=${PR:+#$PR}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          { echo "tags<<EOF"; echo "$TAGS"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          { echo "promote<<EOF"; echo "$PROMOTE"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      # **amd64 만 굽는다.** 예전엔 내보낼 때 arm64 도 같이 구웠는데, amd64 러너가 QEMU 로
      # 에뮬레이션하느라 473MB 짜리 레이어(LibreOffice·JRE)를 설치하는 데만 10분이 더 걸렸다.
      #
      #   PR(amd64)         2분 35초 · 3분 13초 · 3분 24초
      #   태그(amd64+arm64) 8분 10초 · 12분 09초 · 14분 08초
      #
      # 오리진은 x86_64 다(`uname -m` 으로 확인). 아무도 안 쓰는 아키텍처를 매번 굽고
      # 레지스트리에 쌓고 있었다. 오리진을 Ampere 같은 arm64 로 옮기게 되면 platforms 에
      # linux/arm64 를 더하면 되는데, 그때는 ubuntu-24.04-arm 네이티브 러너로 굽는 게 낫다
      # (QEMU 는 느리다). 지금 그걸 미리 만들어 둘 이유는 없다.
      - name: 빌드 (main push면 GHCR push까지)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          build-args: |
            APP_VERSION=${{ steps.appver.outputs.version }}
            APP_BUILD=${{ steps.appver.outputs.build }}
            APP_PR=${{ steps.appver.outputs.pr }}
            APP_BUILT_AT=${{ steps.appver.outputs.built_at }}
          tags: ${{ steps.appver.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 압축된 번들의 스택은 `t.a is not a function` 처럼 읽을 수가 없다. 소스맵을 Sentry 에
      # 올려두면 같은 사건이 원본 파일·줄 번호로 풀려 보인다.
      #
      # **태그 배포일 때만 올린다.** main 머지는 아무데도 안 나가는 v0.0.<빌드> 라, 거기까지
      # 올리면 Sentry 릴리스 목록이 배포되지도 않은 버전으로 덮인다.
      #
      # 맵은 이미지에 없다(Dockerfile 에서 빼뒀다). buildx 로 sourcemaps 스테이지만 꺼내는데,
      # web 스테이지는 바로 위에서 구워 캐시에 있으니 다시 빌드되지 않는다.
      #
      # 릴리스 이름은 **실행 중인 앱이 말하는 것과 정확히 같아야** 한다 —
      # 프런트 lib/sentry.ts 와 백엔드 observability.py 둘 다 `<버전>+<빌드>` 로 만든다.
      # 한 글자만 달라도 Sentry 는 맵을 못 찾고 조용히 압축된 스택을 보여준다.
      #
      # 압축된 번들의 스택은 `t.a is not a function` 처럼 읽을 수가 없다. 소스맵을 Sentry 에
      # 올려두면 같은 사건이 원본 파일·줄 번호로 풀려 보인다.
      #
      # **태그 배포일 때만 올린다.** main 머지는 아무데도 안 나가는 v0.0.<빌드> 라, 거기까지
      # 올리면 Sentry 릴리스 목록이 배포되지도 않은 버전으로 덮인다.
      #
      # 세 단계로 나눠 둔 이유: 꺼내는 일은 build-push-action 이 해야 캐시가 먹고(아래),
      # secret 은 `if:` 에 쓸 수 없어서 '설정이 있나' 를 먼저 출력으로 뽑아야 한다.
      - name: Sentry 설정이 있나
        id: sentry
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Sentry 설정이 없어 건너뜁니다 (secret SENTRY_AUTH_TOKEN · var SENTRY_ORG · var SENTRY_PROJECT)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "$SENTRY_ORG/$SENTRY_PROJECT 로 올립니다."
          fi

      # **맨 `docker buildx build` 로 하면 안 된다.** GHA 캐시 자격(ACTIONS_*)은
      # build-push-action 이 넣어주는 것이라, 손으로 부르면 `--cache-from type=gha` 가
      # 조용히 아무것도 못 찾는다. v1.0.21 에서 그렇게 해서 바로 위에서 구운 web 스테이지를
      # npm ci 부터 통째로 다시 돌렸다 — 이 단계만 55초. 액션으로 부르면 캐시가 먹는다.
      - name: 소스맵 꺼내기 (이미지엔 안 실린다)
        if: steps.sentry.outputs.ready == 'true'
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          target: sourcemaps
          platforms: linux/amd64
          outputs: type=local,dest=sourcemaps
          cache-from: type=gha

      # **이 단계가 실패해도 배포는 나간다**(continue-on-error). 오류를 들여다보는 도구가
      # 못 올라갔다고 해서 고친 코드가 사용자에게 못 가는 건 앞뒤가 바뀐 일이다.
      # 실패하면 이 단계만 빨갛게 남아 눈에 띈다.
      #
      # 릴리스 이름은 **실행 중인 앱이 말하는 것과 정확히 같아야** 한다 —
      # 프런트 lib/sentry.ts 와 백엔드 observability.py 둘 다 `<버전>+<빌드>` 로 만든다.
      # 한 글자만 달라도 Sentry 는 맵을 못 찾고 조용히 압축된 스택을 보여준다.
      #
      # **리전 주소(SENTRY_URL)는 주지 않는다.** Organization Token 은 리전이 토큰 안에
      # 박혀 있어서 밖에서 준 주소를 무시한다. v1.0.21 에서 de.sentry.io 를 줬더니
      # "Using https://sentry.io (embedded in token) rather than manually-configured URL"
      # 경고만 남고 토큰이 말하는 쪽으로 갔다. 죽은 설정을 두면 다음 사람이 그걸 믿는다.
      - name: 소스맵을 Sentry 로
        if: steps.sentry.outputs.ready == 'true'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          RELEASE: ${{ steps.appver.outputs.version }}+${{ steps.appver.outputs.build }}
        run: |
          echo "릴리스 $RELEASE · 꺼낸 파일 $(ls sourcemaps | wc -l)개"
          CLI="npx --yes @sentry/cli@2"
          $CLI releases new "$RELEASE"
          # --url-prefix: 브라우저가 보는 주소는 https://…/assets/index-abc.js 다.
          # '~' 는 '어느 호스트든'. 이게 어긋나면 맵이 올라가도 연결되지 않는다.
          $CLI releases files "$RELEASE" upload-sourcemaps sourcemaps --url-prefix '~/assets'
          # 이 릴리스에 들어간 커밋 — Sentry 가 '어느 변경이 이 오류를 넣었나'를 짚어준다
          $CLI releases set-commits "$RELEASE" --auto || echo "커밋 연결은 건너뜁니다"
          $CLI releases finalize "$RELEASE"
          # **맵은 지우고 간다.** 러너가 사라지니 사실 남지 않지만, 이 줄이 있어야
          # 나중에 누가 artifact 업로드를 붙여도 맵이 딸려 나가지 않는다.
          rm -rf sourcemaps

  # **여기가 배포다.** 굽는 건 이미 끝나 있고, 레지스트리에서 태그만 옮긴다(몇 초).
  # e2e·backend·frontend 가 초록이어야 돈다 — 하나라도 깨지면 :latest 는 제자리에 있다.
  promote:
    needs: [image, backend, frontend, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 태그를 붙인다 (:latest 가 움직이면 watchtower 가 가져간다)
        env:
          PROMOTE: ${{ needs.image.outputs.promote }}
          SRC: ${{ needs.image.outputs.src }}
        run: |
          # imagetools 는 **다시 굽지 않는다** — 레지스트리 안에서 매니페스트만 복사한다.
          ARGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && ARGS+=(--tag "$tag")
          done <<< "$PROMOTE"
          echo "붙일 태그: ${ARGS[*]}"
          # 출처는 **이 run 이 구운 것**이다. github.sha 로 쓰면 같은 커밋의 다른 run 이
          # 덮어쓴 이미지를 승격하게 된다(위 SRC 주석 참고).
          docker buildx imagetools create "${ARGS[@]}" "$SRC"
          echo "${{ needs.image.outputs.version }} 승격 완료"

  # ── 배포가 실제로 나갔는지 확인한다 ──
  # promote 까지는 "레지스트리에 새 태그를 붙였다" 일 뿐이다. 그게 오리진까지 가서
  # 멀쩡히 도는지는 **아무도 안 봤다** — 지금껏 사람이 손으로 curl 해서 확인했다.
  #
  # 태그를 민 배포에서만 돈다. main 머지는 :latest 를 안 건드리므로 확인할 것이 없다.
  verify:
    needs: [promote]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: 새 버전이 뜰 때까지 기다린다
        run: |
          set -euo pipefail
          # 태그 이름이 곧 버전이다(appver 가 그렇게 정한다). 잡 사이로 값을 나르지 않는다.
          WANT="${GITHUB_REF#refs/tags/}"
          echo "기다리는 버전: $WANT"
          # watchtower 폴링(~60초) + 컨테이너 재생성까지 넉넉히. 이미지는 이미 다 구워져
          # 있으므로 여기서 오래 걸리면 그 자체가 신호다.
          for _ in $(seq 1 60); do   # 최대 10분
            NOW=$(curl -fsS --max-time 10 https://file.rgrg.im/api/health 2>/dev/null \
                  | python3 -c 'import sys,json;print(json.load(sys.stdin).get("version",""))' 2>/dev/null || echo "")
            if [ "$NOW" = "$WANT" ]; then
              echo "::notice::$WANT 반영됨"
              exit 0
            fi
            echo "  아직 ${NOW:-응답없음}"
            sleep 10
          done
          echo "::error::10분 안에 $WANT 가 안 올라왔습니다"
          exit 1

      - name: 핵심 경로 점검 (읽기 전용)
        run: |
          set -euo pipefail
          BASE=https://file.rgrg.im
          fail=0
          check() { # 설명 · 기대코드 · 경로
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$BASE$3")
            if [ "$code" = "$2" ]; then printf '  ✓ %-26s %s\n' "$1" "$code"
            else printf '  ✗ %-26s %s (기대 %s)\n' "$1" "$code" "$2"; fail=1; fi
          }
          # 첫 화면이 떠야 하고, 로그인 없이 들어오면 막혀야 한다. 둘 중 하나만
          # 어긋나도 배포가 잘못된 것이다 — 열려 있으면 더 큰일이다.
          check "첫 화면"          200 "/"
          check "CLI 설치 스크립트" 200 "/cli/install.sh"
          check "CLI 버전"          200 "/cli/version"
          check "내 정보(인증 필요)" 401 "/api/me"
          check "공간 목록(인증 필요)" 401 "/api/spaces"

          # SPA 껍데기는 매번 재검증돼야 한다(no-cache). 이게 빠지면 배포해도 사람들이
          # 옛 화면을 본다 — 그 자체로는 아무 에러도 안 난다.
          cc=$(curl -sS -o /dev/null -D - --max-time 15 "$BASE/" | grep -i '^cache-control' | tr -d '\r' || true)
          case "$cc" in
            *no-cache*) printf '  ✓ %-26s %s\n' "껍데기 캐시" "no-cache" ;;
            *) printf '  ✗ %-26s %s\n' "껍데기 캐시" "${cc:-없음}"; fail=1 ;;
          esac

          [ "$fail" = "0" ] || { echo "::error::배포 후 점검 실패"; exit 1; }
          echo "::notice::배포 후 점검 통과"

  # 점검이 깨지면 **자동으로 되돌린다.** 확인만 하고 되돌릴 줄 모르면 "깨졌다" 고
  # 알려주고 끝이라, 결국 사람이 한밤중에 손으로 고쳐야 한다.
  rollback-on-failure:
    needs: [verify]
    if: always() && needs.verify.result == 'failure'
    uses: ./.github/workflows/rollback.yml
    with:
      reason: "배포 후 점검 실패 — ${{ github.ref_name }}"

  # ── 자동 배포(CD): 오리진의 watchtower가 pull 방식으로 처리 ──
  # 오리진(Oracle)이 인바운드 SSH를 소스 IP로 제한 → GitHub 러너에서의 SSH 배포는
  # 연결 타임아웃으로 불가. 그래서 CD는 오리진 쪽에서 pull 한다: 오리진의 watchtower
  # 컨테이너가 GHCR의 :latest 를 ~60초 폴링하다가, 위 image 잡이 새 :latest 를 push하면
  # 자동으로 pull → app 컨테이너 재생성한다(인바운드/방화벽 변경 불필요, 이미지가
  # public이라 레지스트리 인증도 불필요).
  # 오리진 설정: ~/filesharer/compose.override.yml 의 watchtower 서비스(--label-enable로
  # app 컨테이너만 감시). 배포용 DEPLOY_* Secrets는 더 이상 사용하지 않는다.
