# prod 구성: proxy(Caddy) + app 단일 이미지. 상태는 filesharer-data 볼륨 하나.
#
# 배포(VM): CI가 GHCR로 밀어둔 이미지를 받아 쓴다 →  docker compose pull && docker compose up -d
# 로컬/CI 스모크: 소스에서 빌드 →  docker compose up -d --build  (image/build 둘 다 있어 --build면 빌드)
# 참고: GHCR 이미지는 linux/amd64. arm64 호스트에 배포하려면 CI 멀티아치 빌드 필요.
services:
  app:
    image: ghcr.io/jijungon/filesharer:latest
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/app.db
    volumes:
      - filesharer-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    ports:
      - "${FILESHARER_PORT:-8484}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  filesharer-data:
